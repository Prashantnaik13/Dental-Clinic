<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic &amp; Smile Gallery — SmileCare Dental Studio</title>
<meta name="description" content="Take a look inside our clinic, our technology and the smiles we have transformed in Solapur.">
<meta name="theme-color" content="#0b8278">
<meta property="og:title" content="Clinic &amp; Smile Gallery — SmileCare Dental Studio">
<meta property="og:image" content="assets/img/gallery-smile.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b8278'/><ellipse cx='16' cy='15' rx='7' ry='8' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="gallery" id="top">

  <!-- <div class="topbar" data-topbar></div> -->
  <header class="site-header" data-header></header>
  <div class="drawer" data-drawer></div>

  <main>

    <!-- ══ PAGE HERO (from JSON → pageHeroes.gallery) ═══════════════════ -->
    <section class="page-hero">
      <div data-section="page-hero"></div>
    </section>

    <!-- ══ MASONRY GALLERY + FILTERS + LIGHTBOX ═════════════════════════ -->
    <section class="section">
      <div data-section="gallery" data-filter="1"></div>
    </section>

    <!-- ══ BEFORE / AFTER SLIDER ════════════════════════════════════════ -->
    <section class="section section--soft">
      <div data-section="before-after"></div>
    </section>

    <!-- ══ DOCTORS STRIP ════════════════════════════════════════════════ -->
    <section class="section">
      <div data-section="doctors" data-limit="3" data-cta="1"></div>
    </section>

    <!-- ══ CTA ══════════════════════════════════════════════════════════ -->
    <section class="section section--soft">
      <div data-section="cta"></div>
    </section>

  </main>

  <footer class="site-footer" data-footer></footer>
  <div data-floating></div>

  <script src="data/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
