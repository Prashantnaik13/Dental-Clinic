<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an Appointment — SmileCare Dental Studio, Solapur</title>
<meta name="description" content="Book a dental appointment in Solapur. Call, WhatsApp or fill the form — we reply within 30 minutes during clinic hours.">
<meta name="theme-color" content="#0b8278">
<meta property="og:title" content="Book an Appointment — SmileCare Dental Studio">
<meta property="og:image" content="assets/img/hero-dentist.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b8278'/><ellipse cx='16' cy='15' rx='7' ry='8' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>

<body data-page="contact" id="top">

  <!-- <div class="topbar" data-topbar></div> -->
  <header class="site-header" data-header></header>
  <div class="drawer" data-drawer></div>

  <main>

    <!-- ══ PAGE HERO (from JSON → pageHeroes.contact) ═══════════════════ -->
    <section class="page-hero">
      <div data-section="page-hero"></div>
    </section>

    <!-- ══ FOUR CONTACT OPTIONS ═════════════════════════════════════════ -->
    <section class="section">
      <div data-section="contact-cards"></div>
    </section>

    <!-- ══ BOOKING FORM + MAP + HOURS ═══════════════════════════════════ -->
    <section class="section section--soft" id="book" style="padding-top:0">
      <div class="container">
        <div class="contact-layout">
          <div data-section="contact-form"></div>
          <div class="stack">
            <div data-section="map"></div>
            <div data-section="hours"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ══ QUICK FAQ ════════════════════════════════════════════════════ -->
    <section class="section">
      <div data-section="faq" data-limit="4"></div>
    </section>

    <!-- ══ CTA ══════════════════════════════════════════════════════════ -->
    <section class="section section--soft">
      <div data-section="cta"></div>
    </section>

  </main>

  <footer class="site-footer" data-footer></footer>
  <div data-floating></div>

  <script src="data/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
